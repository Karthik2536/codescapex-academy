spring:
  application:
    name: codescapex-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/codescapex_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
    properties:
      dialect: org.hibernate.dialect.MySQLDialect
      format_sql: true